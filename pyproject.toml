[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-python-pg-project"
version = "0.1.0"
description = "FastAPI e-commerce service with PostgreSQL and Pandas reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "eralchemy2>=1.4,<2.0",
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.8,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
